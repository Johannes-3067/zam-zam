DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helmesseiten — Websites für kleine Unternehmen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #08050f;
    --bg-alt: #0d0918;
    --panel: #120c22;
    --text: #f3f0ff;
    --text-muted: #9086b8;
    --accent: #00f6ff;
    --accent2: #ff2ec4;
    --accent-soft: rgba(0,246,255,0.12);
    --accent2-soft: rgba(255,46,196,0.12);
    --border: #2a2148;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  .bg-overlay{
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background:
      radial-gradient(ellipse 900px 500px at 12% -5%, rgba(255,46,196,0.18), transparent 60%),
      radial-gradient(ellipse 900px 600px at 90% 15%, rgba(0,246,255,0.15), transparent 60%),
      rgba(8,5,15,0.3);
  }

  body{
    margin: 0;
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, .wordmark{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }

  a{ color: inherit; }

  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .wrap{
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* ---- Nav ---- */
  header{
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(20,15,35,0.45);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 8px 30px rgba(0,0,0,0.25);
  }

  nav{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    max-width: 1080px;
    margin: 0 auto;
  }

  .wordmark{
    font-size: 2rem;
    text-decoration: none;
    color: var(--accent);
    letter-spacing: 0.01em;
    text-shadow: 0 0 6px rgba(0,246,255,0.8), 0 0 22px rgba(0,246,255,0.5), 0 0 46px rgba(0,246,255,0.3);
  }

  .nav-links{
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .nav-links a{
    text-decoration: none;
    color: var(--text-muted);
    font-size: 0.95rem;
    transition: color 0.15s ease;
  }
  .nav-links a:hover{ color: var(--accent); text-shadow: 0 0 10px rgba(0,246,255,0.6); }

  .btn{
    display: inline-block;
    background: var(--accent);
    color: #071014;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 11px 22px;
    border-radius: 999px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 0 14px rgba(0,246,255,0.55), 0 0 34px rgba(0,246,255,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover{ box-shadow: 0 0 20px rgba(0,246,255,0.8), 0 0 50px rgba(0,246,255,0.4); transform: translateY(-1px); }

  .btn-ghost{
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    color: var(--text);
    border: 1px solid rgba(255,46,196,0.4);
    padding: 10px 21px;
    box-shadow: 0 0 10px rgba(255,46,196,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .btn-ghost:hover{ box-shadow: 0 0 18px rgba(255,46,196,0.6), 0 0 40px rgba(255,46,196,0.25), inset 0 1px 0 rgba(255,255,255,0.25); background: rgba(255,255,255,0.1); transform: none; }

  .menu-toggle{
    display: none;
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.4rem;
    cursor: pointer;
  }

  /* ---- Hero ---- */
  .hero{
    padding: 90px 0 110px;
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 48px;
    align-items: center;
  }

  .hero-copy{ opacity: 0; }
  @media (prefers-reduced-motion: no-preference){
    .hero-copy{
      animation: rise 0.7s ease forwards;
      animation-delay: 0.1s;
    }
  }
  @media (prefers-reduced-motion: reduce){
    .hero-copy{ opacity: 1; }
  }
  @keyframes rise{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .hero h1{
    font-size: clamp(2.3rem, 4.6vw, 3.4rem);
    line-height: 1.12;
    max-width: 12.5ch;
    text-shadow: 0 0 28px rgba(0,246,255,0.22), 0 0 60px rgba(255,46,196,0.14);
  }

  .hero p{
    color: var(--text-muted);
    font-size: 1.08rem;
    max-width: 46ch;
    margin: 22px 0 32px;
  }

  .hero-ctas{
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
